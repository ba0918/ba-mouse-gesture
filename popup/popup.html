<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マウスジェスチャーツール</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        h1 {
            font-size: 18px;
            margin: 0 0 15px 0;
            color: #1a73e8;
            text-align: center;
        }
        
        .status {
            background: #e8f0fe;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .info {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        
        .version {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>🖱️ マウスジェスチャーツール</h1>
    
    <div class="status">
        <strong>Phase 0: 基盤構築完了</strong>
    </div>
    
    <div class="info">
        <p>基本的なプロジェクト構造が完成しました。</p>
        <p><strong>次のステップ:</strong> Phase 1でジェスチャー認識機能を実装します。</p>
        <p><strong>テストページ:</strong> test.htmlで動作確認可能です。</p>
    </div>
    
    <div class="version">
        バージョン 1.0.0（開発版）
    </div>
</body>
</html>
