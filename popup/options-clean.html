<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マウスジェスチャーツール - 設定（Clean Architecture版）</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 24px;
            margin: 0 0 24px 0;
            color: #1a73e8;
            text-align: center;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 16px;
        }
        
        .section {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            background-color: #fafbfc;
        }
        
        .section h2 {
            font-size: 16px;
            margin: 0 0 16px 0;
            color: #202124;
            border-left: 4px solid #1a73e8;
            padding-left: 12px;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .setting-item label {
            font-weight: 500;
            color: #3c4043;
        }
        
        .setting-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #1a73e8;
        }
        
        input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        input[type="range"] {
            width: 120px;
            accent-color: #1a73e8;
        }
        
        .value-display {
            min-width: 40px;
            font-family: monospace;
            font-size: 14px;
            color: #5f6368;
        }
        
        .exclude-list {
            border: 1px solid #dadce0;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            padding: 8px;
            background-color: white;
        }
        
        .exclude-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            margin-bottom: 4px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        
        .exclude-pattern {
            font-family: monospace;
            font-size: 12px;
            color: #3c4043;
        }
        
        .remove-exclude-btn {
            background: #ea4335;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .remove-exclude-btn:hover {
            background: #d93025;
        }
        
        .add-exclude {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .add-exclude input {
            flex: 1;
            padding: 6px;
            border: 1px solid #dadce0;
            border-radius: 4px;
        }
        
        .add-exclude button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .add-exclude button:hover {
            background: #1557b0;
        }
        
        .save-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
        }
        
        .save-status.success {
            background-color: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .save-status.error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        
        .save-status.info {
            background-color: #e3f2fd;
            color: #1976d2;
            border: 1px solid #2196f3;
        }
        
        .architecture-info {
            background: #f0f7ff;
            border: 1px solid #1a73e8;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
        }
        
        .architecture-info h3 {
            margin: 0 0 8px 0;
            color: #1a73e8;
            font-size: 14px;
        }
        
        .architecture-info p {
            margin: 0;
            font-size: 12px;
            color: #5f6368;
        }
        
        .debug-panel {
            background: #fff3e0;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
        }
        
        .debug-panel h3 {
            margin: 0 0 8px 0;
            color: #f57c00;
            font-size: 14px;
        }
        
        .debug-info {
            font-family: monospace;
            font-size: 11px;
            color: #e65100;
            white-space: pre-wrap;
        }
        
        /* カスタム確認ダイアログ */
        .confirm-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirm-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .confirm-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            min-width: 300px;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 10001;
            position: relative;
        }

        .confirm-title {
            margin: 0 0 16px 0;
            font-size: 18px;
            color: #1a73e8;
            text-align: center;
        }

        .confirm-message {
            margin: 0 0 24px 0;
            color: #3c4043;
            text-align: center;
            line-height: 1.5;
        }

        .confirm-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .confirm-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .confirm-btn-cancel {
            background: #f1f3f4;
            color: #3c4043;
        }

        .confirm-btn-cancel:hover {
            background: #e8eaed;
        }

        .confirm-btn-ok {
            background: #1a73e8;
            color: white;
        }

        .confirm-btn-ok:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐭 マウスジェスチャーツール - 設定</h1>
        
        <!-- Clean Architecture 情報 -->
        <div class="architecture-info">
            <h3>🏗️ Clean Architecture 統合版</h3>
            <p>この設定画面は新しいクリーンアーキテクチャで動作しています。Domain・Application・Infrastructure・Presentation層が分離された企業レベル品質の実装です。</p>
        </div>
        
        <!-- 基本設定 -->
        <div class="section">
            <h2>基本設定</h2>
            
            <div class="setting-item">
                <label for="enabled">機能を有効にする</label>
                <input type="checkbox" id="enabled" checked>
            </div>
            
            <div class="setting-item">
                <label for="strokeColor">軌跡の色</label>
                <div class="setting-controls">
                    <input type="color" id="strokeColor" value="#2196F3">
                    <div id="strokePreview" style="width: 40px; height: 20px; border: 3px solid #2196F3; border-radius: 4px;"></div>
                </div>
            </div>
            
            <div class="setting-item">
                <label for="strokeWidth">軌跡の太さ</label>
                <div class="setting-controls">
                    <input type="range" id="strokeWidth" min="1" max="10" value="3">
                    <span id="strokeWidthValue" class="value-display">3px</span>
                </div>
            </div>
            
            <div class="setting-item">
                <label for="gestureThreshold">ジェスチャー感度</label>
                <div class="setting-controls">
                    <input type="range" id="gestureThreshold" min="5" max="50" value="15">
                    <span id="gestureThresholdValue" class="value-display">15px</span>
                </div>
            </div>
        </div>
        
        <!-- 除外サイト -->
        <div class="section">
            <h2>除外サイト</h2>
            <div id="excludeList" class="exclude-list">
                <!-- 動的に生成される -->
            </div>
            <div class="add-exclude">
                <input type="text" id="newExcludeUrl" placeholder="例: example.com, *.google.com">
                <button id="addExcludeBtn">追加</button>
            </div>
        </div>
        
        <!-- ステータス表示 -->
        <div id="saveStatus" class="save-status" style="display: none;">
            <span id="statusMessage"></span>
        </div>
        
        <!-- デバッグパネル -->
        <div class="debug-panel">
            <h3>🛠️ デバッグ情報</h3>
            <div id="debugInfo" class="debug-info">初期化中...</div>
        </div>
    </div>

    <!-- カスタム確認ダイアログ -->
    <div id="confirmDialog" class="confirm-dialog" style="display: none;">
        <div class="confirm-overlay"></div>
        <div class="confirm-content">
            <h3 class="confirm-title">確認</h3>
            <p id="confirmMessage" class="confirm-message"></p>
            <div class="confirm-buttons">
                <button id="confirmCancel" class="confirm-btn confirm-btn-cancel">キャンセル</button>
                <button id="confirmOk" class="confirm-btn confirm-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Clean Architecture バンドルファイル（esbuildで生成） -->
    <script src="../dist/popup/options-new.js"></script>
    
    <!-- 既存の依存ファイル（後方互換性） -->
    <script src="../content_scripts/debug-logger.js"></script>
    <script src="../content_scripts/custom-gesture-manager.js"></script>
    <script src="../content_scripts/gesture-learning-manager.js"></script>
    <script src="../content_scripts/custom-pattern-matcher.js"></script>
</body>
</html>
