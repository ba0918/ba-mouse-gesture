<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マウスジェスチャーツール - 設定</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        /* ローディング状態 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading::after {
            content: '...';
            animation: loading 1.4s infinite ease-in-out;
        }
        
        @keyframes loading {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }
        
        /* エラー状態 */
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        /* Svelteアプリのコンテナ */
        #app {
            min-height: 400px;
        }
        
        /* セクション共通スタイル */
        .section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .section h2 {
            font-size: 18px;
            margin: 0 0 20px 0;
            color: #1a73e8;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 12px;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 8px 0;
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }
        
        .setting-label {
            font-weight: 500;
            color: #202124;
            flex: 1;
        }
        
        .setting-description {
            font-size: 12px;
            color: #5f6368;
            margin-top: 4px;
        }
        
        /* スイッチコンポーネント */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #1a73e8;
        }
        
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        /* フォーム要素 */
        .color-input, .range-input {
            padding: 8px;
            border: 1px solid #dadce0;
            border-radius: 4px;
        }
        
        .range-input {
            width: 120px;
        }
        
        .range-value {
            margin-left: 8px;
            font-weight: 500;
            color: #1a73e8;
            min-width: 30px;
        }
        
        /* ボタン */
        .btn {
            padding: 8px 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #f8f9fa;
            border-color: #adb5bd;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }
        
        .btn-primary:hover {
            background: #1557b0;
        }
        
        /* ステータス表示 */
        .save-status {
            text-align: center;
            padding: 12px;
            border-radius: 4px;
            margin-top: 16px;
            font-weight: 500;
        }
        
        .save-status.success {
            background: #e6f4ea;
            color: #137333;
        }
        
        .save-status.error {
            background: #fce8e6;
            color: #d33b2c;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">設定画面を読み込み中</div>
    </div>
    
    <!-- Svelteアプリケーション -->
    <script src="options.js"></script>
</body>
</html>
