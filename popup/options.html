<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マウスジェスチャーツール - 設定</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 24px;
            margin: 0 0 24px 0;
            color: #1a73e8;
            text-align: center;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 16px;
        }
        
        .section {
            margin-bottom: 24px;
            padding: 16px;
            border: 1px solid #e8eaed;
            border-radius: 8px;
            background-color: #fafbfc;
        }
        
        .section h2 {
            font-size: 16px;
            margin: 0 0 16px 0;
            color: #202124;
            border-left: 4px solid #1a73e8;
            padding-left: 12px;
        }
        
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 8px 0;
        }
        
        .setting-item:last-child {
            margin-bottom: 0;
        }
        
        .setting-label {
            font-weight: 500;
            color: #202124;
            flex: 1;
        }
        
        .setting-description {
            font-size: 12px;
            color: #5f6368;
            margin-top: 4px;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #1a73e8;
        }
        
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        .color-input, .range-input {
            padding: 8px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            width: 80px;
        }
        
        .range-input {
            width: 120px;
        }
        
        .range-value {
            margin-left: 8px;
            font-weight: 500;
            color: #1a73e8;
            min-width: 30px;
        }
        
        .exclude-list {
            margin-top: 12px;
        }
        
        .exclude-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        
        .exclude-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: white;
            border: 1px solid #e8eaed;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        
        .exclude-item:last-child {
            margin-bottom: 0;
        }
        
        .exclude-url {
            flex: 1;
            font-family: monospace;
            color: #5f6368;
        }
        
        .remove-btn {
            background: #ea4335;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .remove-btn:hover {
            background: #d33b2c;
        }
        
        .add-btn {
            background: #34a853;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        
        .add-btn:hover {
            background: #2d8f3f;
        }
        
        .save-status {
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-top: 16px;
            font-weight: 500;
        }
        
        .save-status.success {
            background: #e6f4ea;
            color: #137333;
        }
        
        .preview-canvas {
            border: 1px solid #dadce0;
            border-radius: 4px;
            margin-top: 8px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖱️ マウスジェスチャーツール - 設定</h1>
        
        <!-- 基本設定 -->
        <div class="section">
            <h2>基本設定</h2>
            <div class="setting-item">
                <div>
                    <div class="setting-label">マウスジェスチャーを有効にする</div>
                    <div class="setting-description">チェックを外すと全ての機能が無効になります</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="enabled" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        
        <!-- 軌跡カスタマイズ -->
        <div class="section">
            <h2>軌跡の表示設定</h2>
            <div class="setting-item">
                <div class="setting-label">軌跡の色</div>
                <input type="color" id="strokeColor" class="color-input" value="#2196F3">
            </div>
            <div class="setting-item">
                <div class="setting-label">軌跡の太さ</div>
                <div style="display: flex; align-items: center;">
                    <input type="range" id="strokeWidth" class="range-input" min="1" max="10" value="3">
                    <span class="range-value" id="strokeWidthValue">3px</span>
                </div>
            </div>
            <div class="setting-item">
                <div>
                    <div class="setting-label">軌跡のプレビュー</div>
                    <canvas id="previewCanvas" class="preview-canvas" width="200" height="100"></canvas>
                </div>
            </div>
        </div>
        
        <!-- 除外サイト -->
        <div class="section">
            <h2>除外サイトリスト</h2>
            <div class="setting-item">
                <div>
                    <div class="setting-label">特定のサイトで機能を無効にする</div>
                    <div class="setting-description">
                        例: google.com, *.example.com, https://specific-site.com/*
                    </div>
                    <div class="exclude-list">
                        <input type="text" id="newExcludeUrl" class="exclude-input" placeholder="除外するサイトのURLを入力">
                        <button id="addExcludeBtn" class="add-btn">追加</button>
                        <div id="excludeList"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="saveStatus" class="save-status" style="display: none;"></div>
    </div>
    
    <script src="options.js"></script>
</body>
</html>
